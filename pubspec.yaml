name: poise
description: "A Poise Engine"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/poiseicon.png"
  min_sdk_android: 21

flutter_native_splash:

  color: "#40DCC7"
  image: assets/poiseicon.png

  android: true
  ios: false
